<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}game{% endblock %}</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Shadows+Into+Light&family=Yanone+Kaffeesatz:wght@200..700&display=swap"
          rel="stylesheet">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="../static/style.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/games.svg') }}">


</head>
<body class="text-center" data-bs-theme="dark"
      {% if request.path=='/details' %}
style="background-image: linear-gradient(rgba(10,10,10,.75), rgba(10,10,10,.75)),url({{game[3]}}); background-size:
cover;
;background-repeat: no-repeat; background-position: center"
{% endif %}>

{% include "navbar.html" %}


<div class="toast-container  position-fixed bottom-0 end-0 p-3">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div id="liveToast"
         class="toast {%for category in messages %}bg-{{category[0]}}{%endfor%} bg-opacity-75  text-light align-items-center border-0"
         role="alert"
         aria-live="assertive" aria-atomic="true">

        <div class="toast-header">

            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>

            <img src="../static/img/notification.svg" alt="notification" class="ms-auto notification-icon"
                 style="width: 2rem;">

        </div>
        <div class="toast-body ">

            {% for message in messages %}
            {{ message[1] }}

            {% endfor %}
            {% endif %}
            {% endwith %}
        </div>


    </div>
</div>

<div class="container">
    <div class="h-100 p-lg-5 rounded       {% if request.path=='/details' %}bg-body-tertiary details {%endif%}" >
        {%block content%}
        {%endblock %}

    </div>
</div>
{% include "footer.html" %}


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
